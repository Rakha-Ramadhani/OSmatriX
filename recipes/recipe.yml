---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: frame-silverblue
description: Custom Bluefin-DX image without the dinosaur branding.

# Use bluefin-dx as the base image
base-image: ghcr.io/ublue-os/bluefin-dx
image-version: stable # Options: latest, stable, gts, or a Fedora version (e.g., 41)

modules:
  # 1. Remove Bluefin branding packages and restore standard Fedora logos
  - type: dnf
    install:
      packages:
        - fedora-logos
        - fedora-release-identity-silverblue
        - gnome-backgrounds
        - micro
        - starship
    remove:
      packages:
        - bluefin-logos
        - bluefin-backgrounds
        - bluefin-plymouth
        - bluefin-release

  # 2. Remove remaining Bluefin artwork, custom Plymouth themes, and GNOME overrides
  - type: script
    snippets:
      # Remove custom Bluefin system branding files, wallpapers, and fastfetch dinosaur configs
      - rm -rf /usr/share/ublue-os/bluefin*
      - rm -rf /usr/share/backgrounds/bluefin*
      - rm -rf /usr/share/plymouth/themes/bluefin*
      - rm -rf /etc/skel/.config/fastfetch
      
      # Reset Plymouth boot splash to standard Fedora spinner
      - plymouth-set-default-theme spinner || true

      # Remove Bluefin's dconf/gschema branding overrides (wallpapers, custom accent colors, logo)
      - rm -f /usr/share/glib-2.0/schemas/*bluefin*
      - glib-compile-schemas /usr/share/glib-2.0/schemas/

      # Clean up /etc/os-release branding back to Fedora Silverblue
      - sed -i 's/^NAME=.*/NAME="Fedora Linux"/' /usr/lib/os-release
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Fedora Linux (Silverblue)"/' /usr/lib/os-release
      - sed -i 's/^DEFAULT_HOSTNAME=.*/DEFAULT_HOSTNAME="fedora"/' /usr/lib/os-release

  # 3. Copy any of your own custom system files
  - type: files
    files:
      - source: system
        destination: /

  # 4. Flatpak configuration (Bluefin-DX already includes Flathub by default)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
      - scope: user

  # 5. Required for signed images
  - type: signing
